name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f tests/load/docker-compose.test.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.vanilla.yml config -q
          export PLAYIT_SECRET_KEY=prueba
          docker compose -f docker-compose.yml -f docker-compose.raspberrypi.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.raspberrypi.yml -f docker-compose.vanilla.yml config -q
          cp .env.raspberrypi.example .env
          docker compose config -q

      - name: Modo no premium sincronizado con la lista de plugins
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.nopremium.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prueba.yml config -q
          python3 - <<'EOF'
          import re
          lista = lambda f: set(re.search(r"MODRINTH_PROJECTS: \|-\n((?:\s+\S+\n)+)", open(f).read()).group(1).split())
          base, np_ = lista("docker-compose.yml"), lista("docker-compose.nopremium.yml")
          falta = base - np_
          assert not falta, f"docker-compose.nopremium.yml no tiene: {falta}"
          assert "authmereloaded" in np_
          print("OK", sorted(np_))
          EOF

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh tests/load/*.sh

      - name: Validar parches JSON
        run: for f in config/patches/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: Buscar secretos subidos por error
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::.env no debe estar en git"; exit 1
          fi
